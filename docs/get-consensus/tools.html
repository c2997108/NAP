<h1>get-consensus · WASM tools</h1>
<p>MAFFT 7.525 / VSEARCH 2.29.3 / CD-HIT 4.8.1 の動作確認ページです。配列はブラウザー内で処理されます。</p>
<small>個別ツールを試す画面です。コンセンサス生成パイプラインは NAP の get-consensus タブで実行できます。</small>
<p><label for="input">DNA 配列（FASTA）</label></p>
<textarea id="input" spellcheck="false">&gt;read1
ACGTGCTAGCTACGATCGATGGCATAGCTAGGCTAACGTTAGCCTGACTGATCGTAGCTAGCATGACCTAGGCTAGCTAGCTAGGTACCGATGATCGTACGCTAGCTGACGATCGATGCTAGCATCGT
&gt;read2
ACGTGCTAGCTACGATCGATGGCATAGCTAGGCTAACGTTAGCCTGACTGATCGTAGCTAGCATGACCTAGGCTAGCTAGCTAGCTAGGTACCGATGATCGTACGCTAGCTGACGATCGATGCTAGCATCGT
&gt;indel
ACGTGCTAGCTACGATCGATGGCATAGCTAGGCTAACGTTAGCCTGACTGATCGTAGCTAGCATGACCTAAAGGCTAGCTAGCTAGGTACCGATGATCGTACGCTAGCTGACGATCGATGCTAGCATCGT
</textarea>
<div class="controls"><select id="tool" aria-label="ツール"><option value="mafft">MAFFT --auto</option><option value="vsearch">VSEARCH --cluster_fast</option><option value="cd-hit">CD-HIT</option><option value="cd-hit-est">CD-HIT-EST</option></select><label><input type="checkbox" id="direction">逆相補鎖も処理</label><button id="run">実行</button><button id="cancel" disabled>中止</button><span id="status" role="status">準備完了</span></div>
